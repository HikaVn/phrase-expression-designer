[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phrase-expression-designer"
version = "0.1.0"
description = "DAW-independent expression-control core for strings and sustained virtual instruments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "HikaVn" }]
dependencies = [
    "mido>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
ped = "ped.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests favor wide, inline data construction for readability.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["ped"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
