name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy)
        run: mypy
      - name: Tests
        run: pytest

  cpp-core:
    # The JUCE-free C++ core (plugin/Source/PedCore) — parity with the Python core.
    # The full JUCE plugin build (AU/VST3) is done locally; see docs/PLUGIN.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run PedCore parity test
        run: |
          c++ -std=c++17 -Wall -Wextra -I plugin/Source \
              plugin/tests/test_pedcore.cpp -o pedcore_test
          ./pedcore_test
